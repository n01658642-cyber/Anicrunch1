# R8 on the release build needs more than 2g: at that ceiling the 0.1.63 build died with
# "Gradle build daemon has been stopped: since the JVM garbage collector is thrashing" during
# :app:minifyMobileReleaseWithR8, and only completed once the heap was raised. 6g is the value
# that was actually verified end to end on both flavors.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
org.gradle.configuration-cache=false
